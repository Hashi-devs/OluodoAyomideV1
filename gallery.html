<style>
@font-face{font-family:'Thunder LC';src:url(fonts/Thunder-LC.ttf) format('truetype');font-display:swap}
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.root{--bg:#0A0A0A;--bg2:#111111;--ph:#191919;--line:#232323;--line2:#3B3B3B;--fg:#EDEDEA;--muted:#9B9A95;--accent:#FF5A1F;background:var(--bg);color:var(--fg);font-family:'Geist',system-ui,sans-serif;min-height:100vh;transition:background-color .7s ease,color .7s ease;-webkit-font-smoothing:antialiased}
.root.t-light{--bg:#F3F1EC;--bg2:#EAE7E0;--ph:#E3DFD6;--line:#DCD7CD;--line2:#B5AFA3;--fg:#121212;--muted:#5B5954}
.hdr{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 32px;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .7s ease}
.nav{display:flex;gap:24px;align-items:center}
.nav a{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 0}
.nav a:hover,.nav a.cur{color:var(--fg)}
.brand{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--fg);padding:2px 10px}
.brand .nm{font-family:'Thunder LC','Geist',sans-serif;font-size:36px;line-height:.95;letter-spacing:.01em}
.brand .ul{display:block;height:1px;width:26px;background:var(--fg);margin-top:7px;transition:width .35s ease}
.brand:hover .ul,.brand:focus-visible .ul{width:100%}
.right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.menuBtn{display:none;width:44px;height:44px;padding:0;background:none;border:0;color:var(--fg);cursor:pointer;align-items:center;justify-content:center}
.menuBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.sky{position:relative;width:44px;height:44px;border:0;background:none;overflow:hidden;cursor:pointer;padding:0;color:var(--fg)}
.sky .sun,.sky .moon{position:absolute;left:10px;top:10px;width:24px;height:24px;transition:transform .9s cubic-bezier(.55,0,.2,1),opacity .9s ease}
.sky svg{width:24px;height:24px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sky .sun svg{stroke:#FF6B1A}
.sky .moon svg{stroke:currentColor}
.t-dark .sky .sun{transform:translateY(34px);opacity:0}
.sky .moon{transform:translateY(34px);opacity:0;transition-delay:.18s}
.t-dark .sky .moon{transform:translateY(0);opacity:1}
.head{max-width:1280px;margin:0 auto;padding:88px 32px 40px;box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head h1{font-family:'Thunder LC','Geist',sans-serif;font-size:clamp(80px,10vw,150px);line-height:.85;font-weight:400;margin:0}
.head p{font-size:14px;line-height:1.6;color:var(--muted);max-width:320px;margin:0}
.ph{position:relative;background:var(--ph);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph svg.x{position:absolute;inset:0;width:100%;height:100%}
.ph svg.x line{stroke:var(--line2);stroke-width:1;vector-effect:non-scaling-stroke}
.lb{position:relative;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--ph);padding:3px 7px}
.gal{max-width:1280px;margin:0 auto;padding:0 32px 120px;box-sizing:border-box;columns:4 240px;column-gap:12px}
.tile{display:block;width:100%;margin:0 0 12px;padding:0;border:0;background:none;cursor:zoom-in;break-inside:avoid}
.tile .ph{width:100%}
.tile.h1 .ph{height:230px}.tile.h2 .ph{height:340px}.tile.h3 .ph{height:270px}
.tile:hover .ph{border-color:var(--fg)}
.lbx{position:fixed;inset:0;z-index:60;background:rgba(5,5,5,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lbx .ph{width:min(760px,90vw);height:min(520px,62vh);--ph:#1a1a1a;--line2:#444;--muted:#aaa}
.lbbar{display:flex;gap:8px;align-items:center}
.lbbar button{min-height:44px;min-width:44px;padding:0 14px;background:none;border:1px solid #444;color:#eee;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.lbbar span{font-family:'Geist Mono',monospace;font-size:11px;color:#aaa;padding:0 8px}
.legal{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:22px 32px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legal a{text-decoration:none}
.mmenu{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:16px 20px 32px;box-sizing:border-box}
.mmenu .top{display:flex;justify-content:flex-end}
.mmenu nav{display:flex;flex-direction:column;margin-top:40px}
.mmenu nav a{font-family:'Thunder LC','Geist',sans-serif;font-size:68px;line-height:1.02;color:var(--fg);text-decoration:none}
@media (max-width:760px){
.nav a{display:none}.menuBtn{display:inline-flex}
.hdr{padding:10px 14px}
.brand .nm{font-size:30px}
.head{padding:56px 16px 28px}
.gal{padding:0 16px 72px;columns:2;column-gap:8px}
.tile{margin-bottom:8px}
.tile.h1 .ph{height:150px}.tile.h2 .ph{height:230px}.tile.h3 .ph{height:185px}
.legal{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){.sky .sun,.sky .moon,.root{transition:none}}
</style>
</head>
<body>
